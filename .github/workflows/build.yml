name: Build & publish registry

# On merge to main, rebuild presence.json from the VALID entries (invalid ones are auto-excluded) and
# publish it + the icons to the gh-pages branch. Publishing to a branch (instead of the Pages "artifact"
# API) sidesteps the "multiple github-pages artifacts" deploy error and never pushes to protected main.
# The client fetches:  https://<owner>.github.io/<repo>/presence.json
on:
  push:
    branches: [ main ]
    paths:
      - 'servers/**'
      - 'scripts/**'
  workflow_dispatch: {}   # lets you re-run it by hand from the Actions tab

permissions:
  contents: write         # to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build presence.json (invalid entries excluded)
        env:
          REGISTRY_RAW_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/validate.js --build
      - name: Assemble public/ (json + icons)
        run: |
          mkdir -p public
          cp dist/presence.json public/presence.json
          touch public/.nojekyll
          if [ -d servers ]; then find servers -name icon.png -exec cp --parents {} public/ \; ; fi
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true   # keep gh-pages a single clean commit (no history bloat)
